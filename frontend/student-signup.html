<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="role-signup-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="signup-container">
        <div class="form-header">
            <h2><i class="fas fa-user-graduate"></i> Student Registration</h2>
            <p>Create your secure student account</p>
        </div>

        <form id="student-signup-form" class="form-body">
            <div class="form-grid">
                <!-- Personal Info -->
                <div class="form-group full-width">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="e.g. John Doe">
                </div>

                <div class="form-group">
                    <label>Roll Number (8+ Alphanumeric)</label>
                    <input type="text" id="roll-number" required pattern="[A-Za-z0-9]{8,}"
                        placeholder="e.g. 160120733001">
                    <div class="error-msg">Min 8 chars, letters & numbers only</div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile">
                    <div class="error-msg">Must be 10 digits</div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="student@college.edu">
                </div>

                <!-- Academic Info -->
                <div class="form-group">
                    <label>Department</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="cse">Computer Science (CSE)</option>
                        <option value="ece">Electronics (ECE)</option>
                        <option value="mech">Mechanical</option>
                        <option value="civil">Civil</option>
                        <option value="it">Information Tech (IT)</option>
                        <option value="aiml">AI & ML</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Semester</label>
                    <select id="semester" required>
                        <option value="">Select Semester</option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>

                <!-- Password -->
                <div class="form-group password-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                    <button type="button" class="toggle-password" onclick="togglePass('password')">
                        <i class="far fa-eye"></i>
                    </button>
                    <div class="strength-meter">
                        <div class="strength-bar" id="strength-bar"></div>
                    </div>
                    <div class="error-msg" id="pass-error">Min 12 chars, Upper, Lower, Num, Special</div>
                </div>

                <div class="form-group password-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-password" required>
                </div>

                <!-- Terms -->
                <div class="form-group full-width">
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
                    </div>
                </div>

                <button type="submit" class="btn-submit full-width">Create Account</button>
            </div>

            <p style="text-align: center; margin-top: 1rem; color: #666;">
                Already registered? <a href="login.html" style="color: var(--primary-color);">Login here</a>
            </p>
        </form>
    </div>

    <script src="role-signup-script.js"></script>
    <script>
        // Set role for this page
        window.CURRENT_ROLE = 'student';
    </script>
</body>

</html>
