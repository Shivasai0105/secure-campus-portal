<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure Campus Portal</title>
    <link rel="stylesheet" href="login-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-shield-alt" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
            <h2>Welcome Back</h2>
            <p>Securely log in to your dashboard</p>
        </div>

        <div id="error-msg" class="error-message"></div>

        <form id="login-form">
            <div class="input-group">
                <label for="email">Email Address</label>
                <div style="position: relative;">
                    <input type="email" id="email" required placeholder="name@college.edu">
                    <i class="fas fa-envelope" style="position: absolute; right: 10px; top: 12px; color: #aaa;"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" required placeholder="••••••••••••">
                    <button type="button" onclick="togglePasswordVisibility()"
                        style="border: none; background: none; position: absolute; right: 10px; top: 10px; cursor: pointer; color: #666;">
                        <i class="far fa-eye" id="toggle-icon"></i>
                    </button>
                </div>
            </div>

            <div class="actions">
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">
                Log In <i class="fas fa-arrow-right" style="margin-left: 5px;"></i>
            </button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="register-link">
            Don't have an account? <a href="registration.html">Create Account</a>
        </div>
    </div>

    <script src="login-script.js"></script>
    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>

</html>
